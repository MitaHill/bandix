name: "Build bandix (x86_64-musl)"

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/**'

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build x86_64-unknown-linux-musl
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          chmod +x ./install_dependencies.sh
          sudo ./install_dependencies.sh

      - name: Build
        run: |
          sudo bash -c '
            set -e
            source ~/.cargo/env
            export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=$HOME/musl-cross/x86_64-linux-musl-cross/bin/x86_64-linux-musl-gcc
            cargo build --release --target x86_64-unknown-linux-musl
          '

      - name: Collect binary
        run: |
          VERSION=$(grep '^version' bandix/Cargo.toml | cut -d '"' -f2)
          mkdir -p out
          sudo cp target/x86_64-unknown-linux-musl/release/bandix out/bandix
          sudo chown $USER:$USER out/bandix
          chmod +x out/bandix
          file out/bandix
          sha256sum out/bandix
          echo "version=$VERSION" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bandix-${{ env.version }}-x86_64-unknown-linux-musl
          path: out/bandix
          if-no-files-found: error
